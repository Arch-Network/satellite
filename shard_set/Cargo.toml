[package]
name = "arch-satellite-shard"
version.workspace = true
edition.workspace = true
description = "Shard management for Arch programs"
license = "MIT"
repository = "https://github.com/Arch-Network/satellite"
keywords = ["satellite", "shard"]
categories = ["cryptography::cryptocurrencies"]

[dependencies]
arch_program = { version = "0.6.8" }
bitcoin = "0.32.5"
bytemuck = "1.14"
arch-satellite-bitcoin = { workspace = true }
arch-satellite-lang = { workspace = true }
ordinals = { version = "0.0.14", optional = true }

[features]
default = ["runes", "utxo-consolidation"]
runes = ["arch-satellite-bitcoin/runes", "ordinals"]
utxo-consolidation = ["arch-satellite-bitcoin/utxo-consolidation"]
utoipa = ["arch-satellite-bitcoin/utoipa"]
serde = ["arch-satellite-bitcoin/serde"]