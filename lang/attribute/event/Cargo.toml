[package]
name = "arch-satellite-attribute-event"
version.workspace = true
authors = ["Arch Network <contact@arch.network>", "Saturn BTC <contact@saturnbtc.io>"]
repository = "https://github.com/Arch-Network/satellite"
license = "Apache-2.0"
description = "Satellite attribute macro for defining an event"
rust-version = "1.60"
edition.workspace = true

[lib]
proc-macro = true

[features]
satellite-debug = ["arch-satellite-syn/satellite-debug"]
event-cpi = ["arch-satellite-syn/event-cpi"]
idl-build = ["arch-satellite-syn/idl-build"]

[dependencies]
arch-satellite-syn = { workspace = true, features = ["hash"] }
proc-macro2 = "1"
quote = "1"
syn = { version = "1", features = ["full"] }
